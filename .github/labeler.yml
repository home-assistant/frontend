Agents:
  - changed-files:
      - any-glob-to-any-file:
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
          - "**/GEMINI.md"
          - .agents/**
          - .claude/**
          - .github/agents/**
          - .github/copilot-instructions.md
          - .github/hooks/**
          - .github/instructions/**
          - .github/plugin.json
          - .github/plugin/**
          - .github/prompts/**
          - .github/skills/**
          - .github/workflows/copilot-setup-steps.yml

Automations:
  - changed-files:
      - any-glob-to-any-file:
          - "src/panels/config/{automation,script,scene,blueprint}/**"
          - "src/data/{automation,automation_i18n,script,script_i18n,scene,blueprint}.ts"

Backups:
  - changed-files:
      - any-glob-to-any-file:
          - src/panels/config/backup/**
          - src/data/backup*.ts
          - src/onboarding/onboarding-restore-backup.ts

Build:
  - changed-files:
      - any-glob-to-any-file:
          - build-scripts/**
          - .browserslistrc
          - gulpfile.js

Cast:
  - changed-files:
      - any-glob-to-any-file:
          - cast/src/**
          - src/cast/**

Companion App:
  - changed-files:
      - any-glob-to-any-file:
          - src/external_app/**

Dashboards:
  - changed-files:
      - any-glob-to-any-file:
          - src/panels/lovelace/**
          - src/data/lovelace/**

Demo:
