Agents:
  - changed-files:
      - any-glob-to-any-file:
          - "**/AGENTS.md"
          - .agents/**
          - .claude/**
          - .github/copilot-instructions.md

Build:
  - changed-files:
      - any-glob-to-any-file:
          - build-scripts/**
          - .browserslistrc
          - gulpfile.js

Cast:
  - changed-files:
      - any-glob-to-any-file:
          - cast/src/**
          - src/cast/**

Demo:
  - changed-files:
      - any-glob-to-any-file:
          - demo/src/**
          - src/fake_data/**

Design:
  - changed-files:
      - any-glob-to-any-file:
          - gallery/src/**
          - src/fake_data/**

Dependencies:
  - any:
      - changed-files:
          # Match when only these files are changed (i.e. don't match PRs that happen to add or remove packages)
          - any-glob-to-all-files:
              - package.json
              - renovate.json
              - yarn.lock
              - .yarn/**
              - .yarnrc.yml
              - .nvmrc
      # Dependabot and Renovate branches always match (i.e. compatibility tweaks by members considered minor)
      - head-branch:
          - "^renovate/"
          - "^dependabot/"

GitHub Actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/actions/**
          - .github/workflows/**
          - .github/*.yml

"Tests: E2E":
  - changed-files:
      - any-glob-to-any-file:
          - test/e2e/**

"Tests: App":
  - changed-files:
      - any-glob-to-any-file:
          - test/e2e/app.spec.ts
          - test/e2e/app/**
          - test/e2e/playwright.app.config.ts

"Tests: Demo":
  - changed-files:
      - any-glob-to-any-file:
          - test/e2e/demo.spec.ts
          - test/e2e/playwright.demo.config.ts

"Tests: Design":
  - changed-files:
      - any-glob-to-any-file:
          - test/e2e/gallery.spec.ts
          - test/e2e/playwright.gallery.config.ts

"Tests: Unit":
  - changed-files:
      - any-glob-to-any-file:
          - test/*.ts
          - "test/!(e2e)/**"
