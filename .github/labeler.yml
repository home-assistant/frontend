          - demo/src/**
          - src/fake_data/**

Design:
  - changed-files:
      - any-glob-to-any-file:
          - gallery/src/**
          - src/fake_data/**

Dependencies:
  - any:
      - changed-files:
          # Match when only these files are changed (i.e. don't match PRs that happen to add or remove packages)
          - any-glob-to-all-files:
              - package.json
              - renovate.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - patches/**
              - .nvmrc
      # Dependabot and Renovate branches always match (i.e. compatibility tweaks by members considered minor)
      - head-branch:
          - "^renovate/"
          - "^dependabot/"

Devices & Entities:
  - changed-files:
      - any-glob-to-any-file:
          - "src/panels/config/{devices,entities,areas}/**"
          - src/data/device/device_registry.ts
          - src/data/entity/entity_registry*.ts
          - src/data/floor_registry.ts

