# Path rules for .github/workflows/labeler.yaml, which runs actions/labeler on
# every pull request. A label is added when a pull request changes a matching
# file, and removed again when it no longer does, including one added by hand.
#
# Do not add these labels here. .github/scripts/label-content.mts applies and
# removes them from paths and code. A rule here would remove them whenever its
# paths don't match, even when the script's code check does:
#
# - Companion App
# - Home Assistant Link
# - Labs
# - Supervisor

Activity:
  - changed-files:
      - any-glob-to-any-file:
          - src/panels/logbook/**
          - src/panels/lovelace/**/*logbook*
          - src/data/logbook.ts

Agents:
  - changed-files:
      - any-glob-to-any-file:
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
          - "**/GEMINI.md"
          - .agents/**
          - .claude/**
          - .github/agents/**
          - .github/copilot-instructions.md
          - .github/hooks/**
          - .github/instructions/**
          - .github/plugin.json
          - .github/plugin/**
          - .github/prompts/**
          - .github/skills/**
          - .github/workflows/copilot-setup-steps.yml

