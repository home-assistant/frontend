name: Sync map sprites

# Re-vendors the VersaTiles sprite sheet the map styles reference from the
# release matching the installed @versatiles/style and opens a PR when it drifts.

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - package.json

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'home-assistant/frontend'
    name: Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup

      - name: Update the sprite sheet
        run: ./node_modules/.bin/gulp update-map-sprites

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/sync-map-sprites
          commit-message: Update the bundled map sprite sheet
          title: Update the bundled map sprite sheet
          body: |
            Re-vendored the VersaTiles `base` sprite sheet from the release
            matching the installed `@versatiles/style`.

            Automated by `.github/workflows/sync-map-sprites.yaml`.
