name: Shared node_modules cache benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - workflows-shared-node-modules-cache

env:
  NODE_OPTIONS: --max_old_space_size=6144

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline / ${{ matrix.workload }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workload:
          - build
          - lint
          - test
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node and install
        uses: ./.github/actions/setup
      - name: Check for duplicate dependencies
        if: matrix.workload == 'lint'
        run: yarn dedupe --check
      - name: Build resources
        if: matrix.workload != 'build'
        id: build_resources
        run: >-
          ./node_modules/.bin/gulp gen-icons-json build-translations build-locale-data
          ${{ matrix.workload == 'lint' && 'gather-gallery-pages' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup lint cache
        if: matrix.workload == 'lint'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/prettier
            node_modules/.cache/eslint
            node_modules/.cache/typescript
          key: lint-${{ github.sha }}
          restore-keys: lint-
      - name: Run eslint
        if: matrix.workload == 'lint'
        run: yarn run lint:eslint --quiet
      - name: Run tsc
        if: matrix.workload == 'lint' && !cancelled() && steps.build_resources.outcome == 'success'
        run: yarn run lint:types
      - name: Run lit-analyzer
        if: matrix.workload == 'lint' && !cancelled() && steps.build_resources.outcome == 'success'
        run: yarn run lint:lit --quiet
      - name: Run prettier
        if: matrix.workload == 'lint' && !cancelled() && steps.build_resources.outcome == 'success'
        run: yarn run lint:prettier
      - name: Check dependency licenses
        if: matrix.workload == 'lint' && !cancelled() && steps.build_resources.outcome == 'success'
        run: yarn run lint:licenses
      - name: Run tests
        if: matrix.workload == 'test'
        run: yarn run test
      - name: Build Application
        if: matrix.workload == 'build'
        uses: ./.github/actions/build
        with:
          target: build-app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          is-test: true
      - name: Upload bundle stats
        if: matrix.workload == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-frontend-bundle-stats
          path: build/stats/*.json
          if-no-files-found: error
      - name: Check entrypoint bundle size budget
        if: matrix.workload == 'build'
        run: yarn run check-bundlesize
      - name: Upload frontend build
        if: matrix.workload == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-frontend-build
          path: hass_frontend/
          if-no-files-found: error
          retention-days: 7

  prepare-dependencies:
    name: Prepare dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check for complete dependency tree
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: >-
            node-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('.nvmrc', 'package.json', 'yarn.lock', '.yarnrc.yml', '.yarn/releases/**', '.yarn/patches/**') }}
          lookup-only: true
      - name: Setup Node
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: yarn install --immutable
      - name: Save complete dependency tree
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

  shared-cache:
    name: Shared cache / ${{ matrix.workload }}
    needs: prepare-dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workload:
          - build
          - lint
          - test
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Restore complete dependency tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          fail-on-cache-miss: true
          key: >-
            node-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('.nvmrc', 'package.json', 'yarn.lock', '.yarnrc.yml', '.yarn/releases/**', '.yarn/patches/**') }}
      - name: Check for duplicate dependencies
        if: matrix.workload == 'lint'
        run: yarn dedupe --check
      - name: Build resources
        if: matrix.workload != 'build'
        id: build_resources
        run: >-
          ./node_modules/.bin/gulp gen-icons-json build-translations build-locale-data
          ${{ matrix.workload == 'lint' && 'gather-gallery-pages' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup lint cache
        if: matrix.workload == 'lint'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/prettier
            node_modules/.cache/eslint
            node_modules/.cache/typescript
          key: lint-${{ github.sha }}
          restore-keys: lint-
      - name: Run eslint
        if: matrix.workload == 'lint'
        run: yarn run lint:eslint --quiet
      - name: Run tsc
        if: matrix.workload == 'lint' && !cancelled() && steps.build_resources.outcome == 'success'
        run: yarn run lint:types
      - name: Run lit-analyzer
        if: matrix.workload == 'lint' && !cancelled() && steps.build_resources.outcome == 'success'
        run: yarn run lint:lit --quiet
      - name: Run prettier
        if: matrix.workload == 'lint' && !cancelled() && steps.build_resources.outcome == 'success'
        run: yarn run lint:prettier
      - name: Check dependency licenses
        if: matrix.workload == 'lint' && !cancelled() && steps.build_resources.outcome == 'success'
        run: yarn run lint:licenses
      - name: Run tests
        if: matrix.workload == 'test'
        run: yarn run test
      - name: Build Application
        if: matrix.workload == 'build'
        uses: ./.github/actions/build
        with:
          target: build-app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          is-test: true
      - name: Upload bundle stats
        if: matrix.workload == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-cache-frontend-bundle-stats
          path: build/stats/*.json
          if-no-files-found: error
      - name: Check entrypoint bundle size budget
        if: matrix.workload == 'build'
        run: yarn run check-bundlesize
      - name: Upload frontend build
        if: matrix.workload == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-cache-frontend-build
          path: hass_frontend/
          if-no-files-found: error
          retention-days: 7
